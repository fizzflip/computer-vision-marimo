name: Deploy Marimo to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Build marimo WASM site
        # If you cloned the template repository, this script handles exporting all notebooks
        # run: uv run .github/scripts/build.py
        
        # ⚠️ NOTE: If you are NOT using the template's build.py script and just 
        # want to deploy a single notebook directly, replace the `run` command above with:
        run: |
          uv sync
          marimo export html-wasm notebook.py -o _site --mode run

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site # The template exports files here instead of the root directory

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
